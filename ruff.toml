target-version = "py312"
line-length = 160

[lint]
select = ["E4", "E7", "E9", "F", "B006", "B008", "B904"]
# Estilo del proyecto: sentencias breves en una línea (`if x: return y`, `a(); b()`).
ignore = ["E701", "E702"]

[lint.per-file-ignores]
# Ajustan sys.path antes de importar los servicios.
"tests/*" = ["E402"]
"tools/*" = ["E402"]
