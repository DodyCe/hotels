    sync: false
envVarGroups:
- name: hotels-runtime
  envVars:
  - key: INTERNAL_API_KEY
    generateValue: true
  - key: SERVICE_BIND
    value: 0.0.0.0
  - key: HOTELS_DATA_DIR
    value: /data
  - key: COOKIE_SECURE
    value: '1'
