          maximum: 1000
      required:
      - total
    InventoryResponse:
      type: object
      additionalProperties: false
      properties:
        inventory:
          $ref: '#/components/schemas/InventoryItem'
      required:
      - inventory
    Guest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 120
        user_id:
          type:
          - string
