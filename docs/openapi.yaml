        name: &id005
          type: string
          maxLength: 80
        email: &id006
          type: string
          format: email
          maxLength: 254
        phone: &id007
          type: string
          maxLength: 30
        active: &id008
          type: boolean
        created:
          type: number
      required:
      - id
      - user_id
      - name
      - email
      - phone
      - active
      - created
    GuestCreate:
      type: object
      additionalProperties: false
      properties:
        name: *id005
        email: *id006
        phone: *id007
      required:
      - name
      - email
    GuestPatch:
      type: object
