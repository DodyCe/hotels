components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: hotels_session
      description: Token opaco de sesión (8 horas). Cookie `HttpOnly`, `SameSite=Strict` y `Secure` con `COOKIE_SECURE=1`.
  headers:
    SessionCookie:
      description: '`hotels_session=<token>; HttpOnly; SameSite=Strict; Path=/; Max-Age=28800`'
      schema:
        type: string
  parameters:
    Checkin:
      name: checkin
      in: query
      required: true
      description: Fecha de llegada (AAAA-MM-DD).
      schema:
        type: string
        format: date
      example: '2026-11-04'
    Checkout:
      name: checkout
      in: query
      required: true
      description: Fecha de salida (AAAA-MM-DD), de 1 a 30 noches después de la llegada.
      schema:
        type: string
        format: date
      example: '2026-11-07'
  responses:
    BadRequest:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No hay una sesión válida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Inicia sesión para continuar.
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Demasiados intentos desde la misma IP en un minuto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Un microservicio no está disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SecurityMessage:
      type: object
      required: [message]
      properties:
        message: {type: string}
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        attemptsRemaining:
          type: integer
          minimum: 0
          maximum: 5
        lockedUntil:
          type: [number, 'null']
          description: Fecha Unix de fin del bloqueo, o null antes del sexto fallo.
        retryAfterSeconds:
          type: integer
          minimum: 0
      example:
        error: Selecciona fechas AAAA-MM-DD desde hoy, con una estancia de 1 a 30 noches.
    Ok:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          const: true
    EmptyObject:
      type: object
      example: {}
    RegisterRequest:
      type: object
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
      additionalProperties: false
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
    User:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created:
          type: number
          description: Fecha de alta en segundos Unix.
        role:
          type: string
          enum:
          - guest
          - admin
    UserResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    Hotel:
      type: object
      required:
      - id
      - name
      - city
      - area
      - address
      - description
      - tags
      - amenities
      - image
      - photographer
      - photoPage
      - source
      - badge
      properties:
        id:
          type: string
          example: ghl-monteria
        name:
          type: string
          example: GHL Hotel Montería
        city:
          type: string
        area:
          type: string
        address:
          type: string
        description:
          type: string
        tags:
          type: array
          description: Claves de los filtros de la web.
          items:
            type: string
            enum:
            - wifi
            - restaurant
            - work
        amenities:
          type: array
          items:
            type: string
        image:
          type: string
          format: uri
          description: Foto ilustrativa de Unsplash; no corresponde al hotel.
        photographer:
          type: string
        photoPage:
          type: string
          format: uri
        source:
          type: string
          format: uri
          description: Sitio oficial del hotel de referencia.
        badge:
          type: string
        active:
          type: boolean
    Room:
      type: object
      required:
      - id
      - hotelId
      - name
      - capacity
      - price
      properties:
        id:
          type: string
          example: ghl-monteria-principal
        hotelId:
          type: string
          example: ghl-monteria
        name:
          type: string
          example: Business Superior
        capacity:
          type: integer
          example: 4
        price:
          type: integer
          description: Tarifa de ejemplo por noche, en pesos colombianos.
          example: 350000
        active:
          type: boolean
        inventory_ready:
          type: boolean
          description: Solo las habitaciones con inventario confirmado se ofrecen al público.
    InventoryItem:
      type: object
      required:
      - roomId
      - total
      properties:
        roomId:
          type: string
        total:
          type: integer
          minimum: 1
    AvailabilityItem:
      type: object
      required:
      - roomId
      - total
      - available
      properties:
        roomId:
          type: string
        total:
          type: integer
        available:
          type: integer
          minimum: 0
    ReservationRequest:
      type: object
      required:
      - roomId
      - checkin
      - checkout
      - guests
      properties:
        roomId:
          type: string
          minLength: 1
          maxLength: 120
        hotelId:
          type: string
          description: Opcional; si se envía debe coincidir con el hotel de la habitación.
        checkin:
          type: string
          format: date
        checkout:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
          description: No puede superar la capacidad de la habitación.
    ReservationStatus:
      type: string
      enum:
      - Pendiente
      - Confirmada
      - Rechazada
      - Cancelando
      - Cancelada
    Reservation:
      type: object
      required:
      - id
      - user_id
      - hotel_id
      - room_id
      - hotel
      - room
      - checkin
      - checkout
      - guests
      - total
      - status
      - created
      properties:
        id:
          type: string
          example: HT-3F9A1C2B7D
        user_id:
          type: string
        hotel_id:
          type: string
        room_id:
          type: string
        hotel:
          type: string
          description: Nombre del hotel guardado al reservar.
        room:
          type: string
          description: Nombre del tipo de habitación guardado al reservar.
        hotel_name:
          type: string
        room_name:
          type: string
        checkin:
          type: string
          format: date
        checkout:
          type: string
          format: date
        guests:
          type: integer
        total:
          type: integer
          description: Tarifa por noche × noches, calculada en el servidor.
        status:
          $ref: '#/components/schemas/ReservationStatus'
        created:
          type: number
          description: Segundos Unix.
    ReservationResponse:
      type: object
      required:
      - reservation
      properties:
        reservation:
          $ref: '#/components/schemas/Reservation'
    CancelResponse:
      type: object
      required:
      - ok
      - status
      properties:
        ok:
          type: boolean
          const: true
        status:
          $ref: '#/components/schemas/ReservationStatus'
    Notification:
      type: object
      required:
      - id
      - recipient
      - subject
      - body
      - status
      - created
      properties:
        id:
          type: string
          example: confirmed:HT-3F9A1C2B7D
        recipient:
          type: string
          format: email
        subject:
          type: string
        body:
          type: string
          description: Texto plano del correo.
        status:
          type: string
          enum:
          - vista_previa
          - pendiente
          - reintentando
          - aceptado_smtp
          - error
        created:
          type: number
          description: Segundos Unix.
    HotelCreate:
      type: object
      additionalProperties: false
      properties: &id001
        name:
          type: string
          example: GHL Hotel Montería
        area:
          type: string
        address:
          type: string
        description:
          type: string
        tags:
          type: array
          description: Claves de los filtros de la web.
          items:
            type: string
            enum:
            - wifi
            - restaurant
            - work
        amenities:
          type: array
          items:
            type: string
        image:
          type: string
          format: uri
          description: Foto ilustrativa de Unsplash; no corresponde al hotel.
        photographer:
          type: string
        photoPage:
          type: string
          format: uri
        source:
          type: string
          format: uri
          description: Sitio oficial del hotel de referencia.
        badge:
          type: string
        active:
          type: boolean
      required:
      - name
      - area
      - address
      - description
      - source
    HotelPatch:
      type: object
      additionalProperties: false
      properties: *id001
    HotelResponse:
      type: object
      additionalProperties: false
      properties:
        hotel:
          $ref: '#/components/schemas/Hotel'
      required:
      - hotel
    RoomCreate:
      type: object
      additionalProperties: false
      properties:
        hotelId:
          type: string
          maxLength: 120
        name: &id002
          type: string
          maxLength: 120
        capacity: &id003
          type: integer
          minimum: 1
          maximum: 20
        price: &id004
          type: integer
          minimum: 1
          maximum: 100000000
        total:
          type: integer
          minimum: 1
          maximum: 1000
      required:
      - hotelId
      - name
      - capacity
      - price
      - total
    RoomPatch:
      type: object
      additionalProperties: false
      properties:
        name: *id002
        capacity: *id003
        price: *id004
        active:
          type: boolean
    RoomResponse:
      type: object
      additionalProperties: false
      properties:
        room:
          $ref: '#/components/schemas/Room'
      required:
      - room
    InventoryUpdate:
      type: object
      additionalProperties: false
      properties:
        total:
          type: integer
