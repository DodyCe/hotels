openapi: 3.1.0
info:
  title: Hotels API
  version: 1.1.0
  summary: API pública del Gateway de Hotels.
  description: "API que el navegador consume a través del Gateway (puerto 8080). El Gateway\nquita el prefijo `/api` y reenvía\
    \ cada ruta al microservicio dueño del dominio:\n\n| Prefijo | Microservicio | Puerto interno |\n|---|---|---|\n| `/api/auth/*`\
    \ | Autenticación | 8101 |\n| `/api/notifications` | Notificaciones | 8102 |\n| `/api/reservations*` | Reservas | 8103\
    \ |\n| `/api/hotels*` | Catálogo de hoteles | 8104 |\n| `/api/rooms*` | Habitaciones | 8105 |\n| `/api/availability`,\
    \ `/api/inventory` | Disponibilidad e inventario | 8106 |\n\nReglas comunes del Gateway:\n- Solo acepta `Host` locales\
    \ o el de `PUBLIC_ORIGIN`; los `POST` con otro `Origin` o\n  `Sec-Fetch-Site: cross-site` reciben 403.\n- Los `POST` exigen\
    \ `Content-Type: application/json` y un cuerpo de 1 a 16384 bytes.\n- Si un microservicio no responde, el Gateway devuelve\
    \ 503.\n- Las rutas `/internal/*` (asignación, liberación, reconciliación, eventos y consulta\n  de usuarios) son comunicación\
    \ entre servicios con `X-Internal-Key` y no están\n  expuestas por el Gateway.\n\nTodas las respuestas son JSON y llevan\
    \ `Cache-Control: no-store`. Los errores tienen\nla forma `{\"error\": \"mensaje\"}`.\n\nAdministración: requiere role=admin;\
    \ las cuentas públicas se registran como guest. DELETE desactiva registros y conserva el historial. PATCH/PUT requieren\
    \ JSON. Las rutas internas se documentan en un contrato separado y no se publican por el Gateway.\n"
servers:
- url: http://127.0.0.1:8080/api
  description: Gateway local (INICIAR.cmd o docker compose)
tags:
- name: Autenticación
- name: Catálogo
- name: Habitaciones
- name: Disponibilidad
- name: Reservas
- name: Notificaciones
- name: Huéspedes
paths:
  /auth/register:
    post:
      tags:
      - Autenticación
      summary: Crear cuenta e iniciar sesión
      description: Crea la cuenta, abre una sesión de 8 horas y encola el correo de bienvenida. Comparte con el inicio de
        sesión el límite de 12 intentos por minuto por IP.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada y sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: No se puede registrar ese correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Valida la contraseña (scrypt) y rota la sesión presentada. Los fallos se cuentan por correo en la base de Auth. Se permiten seis fallos dentro de 15 minutos; el sexto bloquea el acceso durante 15 minutos. Los fallos informan attemptsRemaining y el bloqueo incluye lockedUntil y retryAfterSeconds. Un inicio correcto o una recuperación válida reinicia el contador.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Correo o contraseña incorrectos; informa los intentos restantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/forgot-password:
    post:
      tags: [Autenticación]
      summary: Solicitar un enlace de recuperación por correo
      operationId: forgotPassword
      description: Respuesta uniforme para cuentas activas e inexistentes. No devuelve el token ni muestra el enlace en la bandeja web. Un envío por correo cada 60 segundos y hasta tres solicitudes por minuto por IP. Cada enlace vence en 15 minutos; un envío nuevo reemplaza al anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202':
          description: Solicitud recibida, sin revelar si la cuenta existe.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityMessage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/reset-password:
    post:
      tags: [Autenticación]
      summary: Restablecer la contraseña con un enlace de un solo uso
      operationId: resetPassword
      description: El token llega por correo en el fragmento del enlace y se envía en el cuerpo JSON. Cambia sal y hash scrypt, consume el token, revoca todas las sesiones de esa cuenta y elimina su bloqueo temporal. No inicia sesión automáticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password, confirmPassword]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true}
                password: {type: string, minLength: 10, maxLength: 128, writeOnly: true}
                confirmPassword: {type: string, minLength: 10, maxLength: 128, writeOnly: true}
      responses:
        '200':
          description: Contraseña actualizada y sesiones anteriores revocadas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityMessage'}
        '400':
          description: Contraseñas inválidas o distintas; enlace inválido, vencido o consumido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/me:
    get:
      tags:
      - Autenticación
      summary: Usuario de la sesión actual
      operationId: currentUser
      security:
      - session: []
      responses:
        '200':
          description: Perfil de la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión
      description: Revoca la sesión en el servidor y borra la cookie. El cuerpo puede ser `{}`.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
      security:
      - session: []
  /hotels:
    get:
      tags:
      - Catálogo
      summary: Listar hoteles
      operationId: listHotels
      responses:
        '200':
          description: Hoteles de referencia en el orden del catálogo.
          content:
            application/json:
              schema:
                type: object
                required:
                - hotels
                properties:
                  hotels:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hotel'
      parameters:
      - name: includeInactive
        in: query
        description: Incluye inactivos y altas pendientes. Solo administradores.
        schema:
          type: boolean
          default: false
    post:
      tags:
      - Catálogo
      summary: Crear hotel
      operationId: createHotel
      security:
      - session: []
      responses:
        '201':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere el rol admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de correo, estado o inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelCreate'
  /hotels/{hotelId}:
    get:
      tags:
      - Catálogo
      summary: Consultar un hotel
      operationId: getHotel
      parameters:
      - name: hotelId
        in: path
        required: true
        schema:
          type: string
        example: ghl-monteria
      - name: includeInactive
        in: query
        description: Incluye inactivos y altas pendientes. Solo administradores.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Hotel encontrado.
          content:
            application/json:
              schema:
                type: object
                required:
                - hotel
                properties:
                  hotel:
                    $ref: '#/components/schemas/Hotel'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Catálogo
      summary: Editar hotel
      operationId: patchHotel
      security:
      - session: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere el rol admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de correo, estado o inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelPatch'
      parameters:
      - name: hotelId
        in: path
        required: true
        schema:
          type: string
        example: ghl-monteria
    delete:
      tags:
      - Catálogo
      summary: Desactivar hotel y conservar su historial
      operationId: deleteHotel
      security:
      - session: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere el rol admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de correo, estado o inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: hotelId
        in: path
        required: true
        schema:
          type: string
        example: ghl-monteria
  /rooms:
    get:
      tags:
      - Habitaciones
      summary: Listar tipos de habitación
      operationId: listRooms
      parameters:
      - name: hotelId
        in: query
        required: false
        description: Solo los tipos de este hotel.
        schema:
          type: string
      - name: guests
        in: query
        required: false
        description: Solo los tipos con capacidad para este número de huéspedes.
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
      - name: includeInactive
        in: query
        description: Incluye inactivos y altas pendientes. Solo administradores.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Tipos de habitación que cumplen los filtros.
          content:
            application/json:
              schema:
                type: object
                required:
                - rooms
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Habitaciones
      summary: Crear habitación y su inventario
      operationId: createRoom
      security:
      - session: []
      responses:
        '201':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere el rol admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de correo, estado o inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: Habitación guardada; Inventario está pendiente y se reintentará automáticamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
  /rooms/{roomId}:
    get:
      tags:
      - Habitaciones
      summary: Consultar un tipo de habitación
      operationId: getRoom
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
        example: ghl-monteria-principal
      - name: includeInactive
        in: query
        description: Incluye inactivos y altas pendientes. Solo administradores.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Tipo de habitación encontrado.
          content:
            application/json:
              schema:
                type: object
                required:
                - room
                properties:
                  room:
                    $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Habitaciones
      summary: Editar habitación
      operationId: patchRoom
      security:
      - session: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere el rol admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de correo, estado o inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomPatch'
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
        example: ghl-monteria-principal
    delete:
      tags:
      - Habitaciones
      summary: Desactivar habitación y conservar su historial
      operationId: deleteRoom
      security:
      - session: []
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión requerida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Se requiere el rol admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recurso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto de correo, estado o inventario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Servicio no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: roomId
        in: path
        required: true
        schema:
          type: string
        example: ghl-monteria-principal
  /inventory:
    get:
      tags:
      - Disponibilidad
      summary: Unidades por tipo de habitación
      operationId: listInventory
      responses:
        '200':
          description: Inventario total por tipo.
          content:
            application/json:
              schema:
                type: object
                required:
                - inventory
                properties:
                  inventory:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryItem'
  /availability:
    get:
      tags:
      - Disponibilidad
      summary: Disponibilidad por rango de fechas
      description: 'Unidades libres de cada tipo en todas las noches del rango. La fecha de salida no

        ocupa noche. Las fechas se validan con el calendario de Montería (UTC-5): llegada

        desde hoy y estancia de 1 a 30 noches.

        '
      operationId: getAvailability
      parameters:
      - $ref: '#/components/parameters/Checkin'
      - $ref: '#/components/parameters/Checkout'
      responses:
        '200':
          description: Disponibilidad por tipo de habitación.
          content:
            application/json:
              schema:
                type: object
                required:
                - availability
                properties:
                  availability:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailabilityItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /reservations:
    get:
      tags:
      - Reservas
      summary: Reservas de la cuenta
      operationId: listReservations
      security:
      - session: []
      responses:
        '200':
          description: Reservas propias, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: object
                required:
                - reservations
                properties:
                  reservations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Reservas
      summary: Crear una reserva
      description: 'El precio y el propietario los decide el servidor. Reservas consulta la habitación

        y el hotel por API y pide la asignación a Inventario. Si Inventario no responde, la

        reserva queda `Pendiente` (202) y un trabajador la confirma o rechaza después.

        '
      operationId: createReservation
      security:
      - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '201':
          description: Reserva confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '202':
          description: Reserva guardada como Pendiente hasta que Inventario responda.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La habitación no tiene cupos para esas fechas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
  /reservations/{reservationId}/cancel:
    post:
      tags:
      - Reservas
      summary: Cancelar una reserva propia
      description: Idempotente. Si Inventario no responde, queda `Cancelando` (202) y se completa al recuperarlo. El cuerpo
        puede ser `{}`.
      operationId: cancelReservation
      security:
      - session: []
      parameters:
      - name: reservationId
        in: path
        required: true
        schema:
          type: string
        example: HT-3F9A1C2B7D
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Reserva cancelada, o ya estaba cancelada o rechazada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '202':
          description: Cancelación en proceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La reserva no existe o pertenece a otra cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notifications:
    get:
      tags:
      - Notificaciones
      summary: Avisos de la cuenta
      description: Hasta 100 mensajes, del más reciente al más antiguo. El destinatario siempre es el correo de la cuenta
        en Auth.
      operationId: listNotifications
      security:
      - session: []
      responses:
        '200':
          description: Mensajes y estado del envío por SMTP.
          content:
            application/json:
              schema:
                type: object
                required:
                - notifications
                - smtpConfigured
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  smtpConfigured:
                    type: boolean
                    description: Si es falso, los mensajes quedan solo como vista previa en la web.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /guests:
    get:
      tags:
      - Huéspedes
      summary: Listar huéspedes activos e inactivos
      operationId: listGuests
      security:
      - session: []
      responses:
        '200':
